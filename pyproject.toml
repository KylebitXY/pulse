[project]
name = "pulsemesh"
version = "0.1.0"
description = "Enterprise realtime messaging platform"
authors = [
    {name = "kylebitxy"}
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi (>=0.136.1,<0.137.0)",
    "uvicorn[standard] (>=0.47.0,<0.48.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.1,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "websockets (>=16.0,<17.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "prometheus-client (>=0.25.0,<0.26.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "pybreaker (>=1.4.1,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "orjson (>=3.11.9,<4.0.0)",
    "prometheus-fastapi-instrumentator (>=7.1.0,<8.0.0)",
    "opentelemetry-api (>=1.41.1,<2.0.0)",
    "opentelemetry-sdk (>=1.41.1,<2.0.0)",
    "opentelemetry-instrumentation-fastapi (>=0.62b1,<0.63)",
    "opentelemetry-exporter-otlp (>=1.41.1,<2.0.0)",
    "python-json-logger (>=4.1.0,<5.0.0)",
    "asyncio (>=4.0.0,<5.0.0)",
    "apscheduler (>=3.11.2,<4.0.0)",
    "limits (>=5.8.0,<6.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.13,<0.16.0)",
    "black (>=26.3.1,<27.0.0)",
    "mypy (>=2.1.0,<3.0.0)",
    "faker (>=40.18.0,<41.0.0)",
    "factory-boy (>=3.3.3,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
